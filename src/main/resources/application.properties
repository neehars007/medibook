spring.application.name=medibook
spring.profiles.default=dev
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# --- Database (PostgreSQL 16 + Flyway) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medibook}
spring.datasource.username=${DB_USER:medibook}
spring.datasource.password=${DB_PASSWORD:medibook}
# Flyway owns the schema (db/migration); Hibernate never alters it
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Redis (holds, sessions, rate limits) ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Redis is used via StringRedisTemplate only, not as a Spring Data repository store
spring.data.redis.repositories.enabled=false

# --- Mail (MailHog in dev) ---
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}

# --- Uploads ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info

# --- MediBook ---
medibook.jwt.secret=${JWT_SECRET}
medibook.jwt.access-ttl=15m
medibook.jwt.refresh-ttl=7d

medibook.security.inactivity-timeout=15m
medibook.security.max-failed-logins=5
medibook.security.lockout-duration=15m
medibook.security.cookie-secure=${COOKIE_SECURE:true}

# AES-256-GCM key for sensitive columns (base64, 32 bytes)
medibook.crypto.key=${MEDIBOOK_ENCRYPTION_KEY}

medibook.storage.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
medibook.storage.access-key=${MINIO_ACCESS_KEY:minioadmin}
medibook.storage.secret-key=${MINIO_SECRET_KEY:minioadmin}
medibook.storage.bucket=${MINIO_BUCKET:medibook-private}
medibook.storage.signed-url-ttl=5m
medibook.storage.max-upload-bytes=10485760

# Leave blank to run payments in simulated mode (auto-succeeds)
medibook.stripe.secret-key=${STRIPE_SECRET_KEY:}
medibook.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
medibook.stripe.currency=usd

medibook.mail.from=${MAIL_FROM:no-reply@medibook.test}

medibook.app.frontend-url=${FRONTEND_URL:http://localhost:5173}
medibook.app.timezone=${CLINIC_TIMEZONE:America/New_York}
medibook.app.seed-demo-data=false

medibook.booking.hold-ttl=10m
medibook.booking.chart-access-days=90
medibook.booking.video-join-early=10m

medibook.rate-limit.login-per-minute=10
medibook.rate-limit.booking-per-minute=30
medibook.rate-limit.search-per-minute=120

medibook.video.base-url=https://meet.jit.si
